name: Hourly Sports Sync

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger FamBam sports sync
        run: |
          curl --fail --silent --show-error \
            https://family-sports-hub.vercel.app/api/sync/sports \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
