name: One-time Challenge Rebuild

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manual-challenge-rebuild.yml"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh FamBam sports data
        run: |
          set -o pipefail
          code=$(curl --silent --show-error \
            -o sync-response.json \
            -w "%{http_code}" \
            "https://family-sports-hub.vercel.app/api/sync/sports" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat sync-response.json
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Rebuild current FamBam Challenge
        run: |
          set -o pipefail
          code=$(curl --silent --show-error \
            -X POST \
            -o response.json \
            -w "%{http_code}" \
            "https://family-sports-hub.vercel.app/api/challenge/auto-build?reset=true" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          test "$code" -ge 200 -a "$code" -lt 300

# Triggered 2026-10-01 after full Challenge picks audit.
