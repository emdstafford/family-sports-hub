name: Monday FamBam Challenge Reset

on:
  schedule:
    # 11:15 UTC = 7:15 AM EDT Monday. Challenge weeks roll over Monday.
    - cron: "15 11 * * 1"
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh FamBam sports data
        run: |
          curl --fail --silent --show-error \
            https://family-sports-hub.vercel.app/api/sync/sports \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Create fresh 10-pick weekly challenge
        run: |
          curl --fail --silent --show-error \
            -X POST \
            "https://family-sports-hub.vercel.app/api/challenge/auto-build?reset=true" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
