name: Sunday AP Rankings Refresh

on:
  schedule:
    # 00:00 UTC Monday is 8:00 PM Eastern during daylight-saving time.
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sunday-rankings.yml"

jobs:
  rankings:
    runs-on: ubuntu-latest

    steps:
      - name: Import latest AP Top 25 rankings
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            -X POST \
            "https://family-sports-hub.vercel.app/api/college-football/rankings/import?year=2026"

      - name: Rebuild current FamBam Challenge with new rankings
        if: always()
        run: |
          curl --fail --silent --show-error \
            -X POST \
            https://family-sports-hub.vercel.app/api/challenge/auto-build \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
